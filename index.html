<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokédex Collector</title>
<meta name="description" content="Completa a tua Pokédex em cartas: marca o que tens e descobre as cartas mais valiosas de cada Pokémon.">
<meta name="theme-color" content="#14161c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pokédex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#eef0f4; --surface-3:#e6e9ef;
  --ink:#1a1d26; --muted:#6a7280; --faint:#99a0ad; --line:#e3e6ec;
  --accent:#c8901a; --accent-ink:#8a6206; --accent-soft:#f6ead0;
  --good:#2e9e5b; --good-soft:#d9f2e2; --info:#2f6feb; --danger:#d64545;
  --shadow:0 1px 2px rgba(20,22,28,.06),0 6px 18px rgba(20,22,28,.06);
  color-scheme:light;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  --bg:#101219; --surface:#191c24; --surface-2:#222633; --surface-3:#2a2f3d;
  --ink:#eef0f6; --muted:#98a0b2; --faint:#6c7488; --line:#2a2f3d;
  --accent:#e6b53f; --accent-ink:#f2ce78; --accent-soft:#2e2716;
  --good:#48c07d; --good-soft:#173322; --info:#5b90ff; --danger:#f0736f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101219; --surface:#191c24; --surface-2:#222633; --surface-3:#2a2f3d;
  --ink:#eef0f6; --muted:#98a0b2; --faint:#6c7488; --line:#2a2f3d;
  --accent:#e6b53f; --accent-ink:#f2ce78; --accent-soft:#2e2716;
  --good:#48c07d; --good-soft:#173322; --info:#5b90ff; --danger:#f0736f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
}
img{max-width:100%; display:block}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
input{font:inherit}
a{color:var(--info); text-decoration:none}
[hidden]{display:none!important}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:Sora,sans-serif; margin:0; text-wrap:balance}

/* ---------- app bar ---------- */
.bar{position:sticky; top:env(safe-area-inset-top,0); z-index:30; background:color-mix(in srgb,var(--surface) 88%, transparent); backdrop-filter:blur(12px); border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px; margin:0 auto; padding:10px 16px 8px}
.row{display:flex; align-items:center; gap:10px}
.brand{display:flex; align-items:center; gap:9px; font-family:Sora; font-weight:700; font-size:17px; letter-spacing:-.2px}
.brand .pk{width:26px;height:26px;border-radius:50%;flex:0 0 auto;
  background:
    radial-gradient(circle at 50% 50%, #fff 0 15%, #18181c 15% 22%, transparent 22%),
    linear-gradient(#ee1c25 0 50%, #f4f5f7 50% 100%);
  border:2px solid #18181c; box-shadow:inset 0 0 0 2px rgba(0,0,0,.06)}
.spacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--muted);background:var(--surface-2)}
.iconbtn:hover{color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.progress-wrap{margin-top:9px;display:flex;align-items:center;gap:11px}
.pbar{flex:1;height:9px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#e8b84e);border-radius:99px;transition:width .5s ease}
.pcount{font-family:Sora;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.pcount b{color:var(--ink)}
.search{margin-top:9px;position:relative}
.search input{width:100%;padding:11px 12px 11px 40px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint)}
.chips{display:flex;gap:7px;margin-top:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 13px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-size:13px;font-weight:600;border:1px solid transparent}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.on.gen{background:var(--accent);color:#231a04;border-color:var(--accent)}

/* ---------- grid ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:11px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:8px 8px 9px;box-shadow:var(--shadow);
  content-visibility:auto;contain-intrinsic-size:158px;transition:transform .12s ease,border-color .12s}
.tile:active{transform:scale(.97)}
.tile.owned{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.tile .imgbox{aspect-ratio:1/1;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.tile .imgbox img{width:100%;height:100%;object-fit:contain;padding:4px}
.tile.card-mode .imgbox img{object-fit:cover;padding:0}
.tile .num{font-size:11px;color:var(--faint);font-weight:600;margin-top:6px}
.tile .nm{font-size:12.5px;font-weight:600;line-height:1.2;letter-spacing:-.1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .rbadges{position:absolute;top:6px;left:6px;display:flex;gap:3px}
.rbadge{font-size:9px;font-weight:800;letter-spacing:.3px;padding:2px 5px;border-radius:6px;background:var(--surface-3);color:var(--muted);text-transform:uppercase}
.rbadge.reg{background:#e9d5ff;color:#6b21a8}
:root[data-theme="dark"] .rbadge.reg,:root:not([data-theme="light"]) .rbadge.reg{background:#3b2a52;color:#d6b4ff}
.check{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--line);color:var(--faint);z-index:2}
.check svg{width:16px;height:16px}
.tile.owned .check{background:var(--good);border-color:var(--good);color:#fff}
.tile .ownedcard{margin-top:5px;font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:4px;min-height:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tile .ownedcard b{color:var(--accent-ink)}
.tile .nocardtag{margin-top:5px;font-size:10.5px;color:var(--faint);min-height:14px}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink);font-family:Sora}

/* ---------- detail ---------- */
.detail{max-width:900px;margin:0 auto;padding:0 16px 48px}
.dtop{display:flex;align-items:center;gap:12px;padding:14px 0 6px}
.dtop .back{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink);flex:0 0 auto}
.dtop .back svg{width:22px;height:22px}
.dtitle .num{font-size:12px;color:var(--faint);font-weight:700;letter-spacing:.5px}
.dtitle h1{font-size:24px;font-weight:700;letter-spacing:-.4px;line-height:1.1}
.ftabs{display:flex;gap:7px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.ftabs::-webkit-scrollbar{display:none}
.ftab{white-space:nowrap;padding:8px 14px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-weight:600;font-size:13px;border:1px solid transparent}
.ftab.on{background:var(--accent);color:#231a04;border-color:var(--accent)}
.ftab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-left:6px;vertical-align:middle}

.mine{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-top:6px;display:flex;gap:14px;align-items:center}
.mine.none{border-style:dashed;color:var(--muted);display:block;text-align:center;padding:20px 16px}
.mine .cardimg{width:96px;flex:0 0 auto;aspect-ratio:734/1024;border-radius:9px;overflow:hidden;background:var(--surface-2);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.mine .cardimg img{width:100%;height:100%;object-fit:cover}
.mine .meta{flex:1;min-width:0}
.mine .meta .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:700}
.mine .meta h3{font-size:17px;margin:2px 0 3px;font-family:Sora}
.mine .meta .set{font-size:13px;color:var(--muted)}
.mine .price{font-family:Sora;font-weight:700;font-size:19px;margin-top:6px}
.mine .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{padding:9px 14px;border-radius:11px;font-weight:600;font-size:13px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.gold{background:var(--accent);color:#231a04;border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.danger{color:var(--danger)}

.pick-banner{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent-ink);
  border-radius:14px;padding:11px 14px;margin-top:12px;font-weight:600;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.pick-banner .btn{background:var(--surface)}

.sectrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sectrow h2{font-size:16px;font-weight:600}
.sectrow .sub{font-size:12px;color:var(--muted)}
.sortbar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.sortbar .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.sortbtn{padding:6px 11px;border-radius:9px;background:var(--surface-2);color:var(--muted);font-size:12.5px;font-weight:600;border:1px solid transparent}
.sortbtn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pricenote{font-size:11.5px;color:var(--faint);margin-left:auto}

.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.ccard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);
  content-visibility:auto;contain-intrinsic-size:280px}
.ccard.mine-card{border-color:var(--good);box-shadow:0 0 0 2px color-mix(in srgb,var(--good) 45%,transparent),var(--shadow)}
.ccard .ci{aspect-ratio:734/1024;background:var(--surface-2);position:relative}
.ccard .ci img{width:100%;height:100%;object-fit:cover}
.ccard .ci .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--faint);font-size:11px;text-align:center;padding:10px}
.cm-mini{font-size:10px;font-weight:700;color:var(--info);border:1px solid var(--line);padding:3px 7px;border-radius:7px}
.cardsearch{position:relative;margin:2px 0 12px}
.cardsearch>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}
.cardsearch input{width:100%;padding:10px 34px 10px 36px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:14px}
.cardsearch input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.cs-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:7px;color:var(--muted);background:var(--surface-3);font-size:12px}
.searchnote{font-size:11.5px;color:var(--muted);margin:-6px 0 10px;padding-left:2px}
.ccard .topbadges{position:absolute;top:7px;left:7px;right:7px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.ribbon{font-size:9.5px;font-weight:800;letter-spacing:.3px;padding:3px 6px;border-radius:7px;background:rgba(20,22,28,.72);color:#fff;text-transform:uppercase;backdrop-filter:blur(3px)}
.ribbon.art{background:linear-gradient(90deg,#b45309,#e0a83a);color:#231a04}
.ribbon.top{background:var(--accent);color:#231a04}
.ccard .info{padding:8px 9px 10px}
.ccard .cset{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard .cname{font-size:12.5px;font-weight:600;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard .crow{display:flex;align-items:center;justify-content:space-between;margin-top:7px;gap:6px}
.ccard .cprice{font-family:Sora;font-weight:700;font-size:14px}
.ccard .cprice.usd{color:var(--muted);font-weight:600}
.ccard .cprice .load{display:inline-block;width:34px;height:11px;border-radius:4px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sh 1.1s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.ccard .rar{font-size:10px;color:var(--faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard .cacts{display:flex;gap:6px;padding:0 9px 10px}
.ccard .cacts .btn{flex:1;justify-content:center;text-align:center}
.cm-link{color:var(--muted);font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.cm-link svg{width:12px;height:12px}
.upgrade-hint{font-size:10.5px;color:var(--accent-ink);font-weight:700;padding:0 9px 8px}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.scrim.show{opacity:1}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0));box-shadow:0 -10px 40px rgba(0,0,0,.3);
  transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);max-height:86vh;overflow:auto}
.scrim.show .sheet{transform:translateY(0)}
.sheet .grip{width:38px;height:4px;border-radius:99px;background:var(--surface-3);margin:6px auto 12px}
.sheet h3{font-family:Sora;font-size:17px;margin-bottom:2px}
.sheet p.s{color:var(--muted);font-size:13px;margin:0 0 14px}
.sheet .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px;border-radius:13px;background:var(--surface-2);margin-bottom:9px;border:1px solid var(--line)}
.sheet .opt .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface);flex:0 0 auto}
.sheet .opt .ic svg{width:20px;height:20px;color:var(--accent-ink)}
.sheet .opt .tx{flex:1}
.sheet .opt .tx b{display:block;font-weight:600;font-size:14px}
.sheet .opt .tx span{font-size:12px;color:var(--muted)}
.sheet .opt.danger .ic svg{color:var(--danger)}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .lab b{font-size:14px;font-weight:600}
.setrow .lab span{display:block;font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.rbadge.soft{background:var(--surface-3);color:var(--faint)}
.tile.reg-tile{background:linear-gradient(180deg,color-mix(in srgb,var(--accent-soft) 55%,var(--surface)),var(--surface))}
.cardsearch.pk{margin:4px 0 10px}
.pk-current{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:9px 12px;margin-bottom:10px;font-size:13px}
.pk-current b{color:var(--accent-ink)}
#pkList{max-height:54vh;overflow:auto;margin:0 -4px;padding:0 4px}
.pklist{display:flex;flex-direction:column;gap:7px}
.pkrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:8px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.pkrow:active{transform:scale(.99)}
.pkimg{width:44px;height:61px;flex:0 0 auto;border-radius:6px;overflow:hidden;background:var(--surface-3);display:grid;place-items:center;color:var(--faint);font-size:11px}
.pkimg img{width:100%;height:100%;object-fit:cover}
.pkmeta{flex:1;min-width:0}
.pknm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pkset{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pkrar{font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pkprice{flex:0 0 auto;font-family:Sora;font-weight:700;font-size:14px;text-align:right;min-width:58px}
.pkprice .usd{color:var(--muted);font-weight:600}
.artdot{color:var(--accent-ink)}
.lchip{display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.3px;padding:1px 4px;border-radius:4px;background:var(--surface-3);color:var(--muted);vertical-align:middle}
.lchip.l-ja{background:#f8dcdc;color:#a52222}
.lchip.l-zhtw{background:#fdeccb;color:#875200}
.lchip.l-ko{background:#dde4fb;color:#2536a0}
:root[data-theme="dark"] .lchip.l-ja,:root:not([data-theme="light"]) .lchip.l-ja{background:#4a2020;color:#f4b4b4}
:root[data-theme="dark"] .lchip.l-zhtw,:root:not([data-theme="light"]) .lchip.l-zhtw{background:#453214;color:#f0cd88}
:root[data-theme="dark"] .lchip.l-ko,:root:not([data-theme="light"]) .lchip.l-ko{background:#232f5a;color:#b6c4f5}

/* ---------- toast / loader ---------- */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0));transform:translateX(-50%) translateY(20px);z-index:80;
  background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.3);
  opacity:0;transition:.2s;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .undo{color:var(--accent);font-weight:700}
.loader{display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 16px;color:var(--muted)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface-3);border-top-color:var(--accent);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.errbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);margin-top:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* scan */
.botnav{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--faint);font-size:11px;font-weight:600;font-family:Sora}
.navbtn svg{width:22px;height:22px}
.navbtn.on{color:var(--accent-ink)}
main{padding-bottom:68px}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0));z-index:40;display:flex;align-items:center;gap:8px;
  padding:13px 17px;border-radius:99px;background:var(--accent);color:#231a04;font-weight:700;font-size:14px;font-family:Sora;

<script>
"use strict";
/* ============================ config & data ============================ */
const GQL = 'https://api.tcgdex.net/v2/graphql';
const REST = 'https://api.tcgdex.net/v2/en/cards/';
const ARTWORK = n => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${n}.png`;
const cardImg = (base, q) => base ? `${base}/${q}.webp` : null;
const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="22" fill="none" stroke="%23b9bfca" stroke-width="4"/><line x1="10" y1="32" x2="54" y2="32" stroke="%23b9bfca" stroke-width="4"/><circle cx="32" cy="32" r="7" fill="none" stroke="%23b9bfca" stroke-width="4"/></svg>');

const REGION_LABEL = {alola:'Alolan', galar:'Galarian', hisui:'Hisuian', paldea:'Paldean'};
const FORM_ORDER = ['base','mega','alola','galar','hisui','paldea','other'];
const FORM_LABEL = {base:'Base', mega:'Mega', alola:'Alolan', galar:'Galarian', hisui:'Hisuian', paldea:'Paldean', other:'Outras'};
const GEN_RANGES = {1:[1,151],2:[152,251],3:[252,386],4:[387,493],5:[494,649],6:[650,721],7:[722,809],8:[810,905],9:[906,1025]};

// rarity ranking (best -> worst) for fallback sort & tiering
const RARITY_ORDER = ['Special illustration rare','Mega Hyper Rare','Hyper rare','Crown','Secret Rare','Rainbow Rare','Gold',
  'Shiny rare VMAX','Shiny rare','Two Shiny','One Shiny','Illustration rare','Ultra Rare','Amazing Rare','Radiant Rare',
  'Double rare','Holo Rare VSTAR','Holo Rare VMAX','Holo Rare V','Rare Holo LV.X','Rare Holo','Holo Rare','Classic Collection',
  'Four Diamond','Three Diamond','Three Star','Two Star','One Star','Two Diamond','One Diamond','Rare','Promo','Uncommon','Common','None'];
const rarityRank = r => { const i = RARITY_ORDER.indexOf(r); return i<0 ? RARITY_ORDER.indexOf('Rare') : i; };
const ART_KEYS = ['illustration','full art','hyper','secret','rainbow','gold','shiny','crown','amazing','radiant','star'];
const isArtRarity = r => !!r && ART_KEYS.some(k => r.toLowerCase().includes(k));

let NATIONAL = [], REGIONAL = {}, REG_TOTAL = 0, SETCODES = {};   // REGIONAL: {dexN:[[region,artId],...]}  SETCODES: {setId:"MEW"}

/* ============================ storage ============================ */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let collection = LS.get('pdc.collection', {});   // slotId -> {cardId,name,setName,image,rarity,price,cur,addedAt}
let settings = Object.assign({filter:'all', gen:'all', listImage:'pokemon', sort:'value', theme:'system'}, LS.get('pdc.settings', {}));
const saveCollection = () => LS.set('pdc.collection', collection);
const saveSettings = () => LS.set('pdc.settings', settings);
const slotId = (n, form) => (form && form!=='base') ? `d${n}:${form}` : `d${n}`;

/* ---- owned cards: card-level store (wallet + sets source of truth) ---- */
const GRADES = ['raw','PSA 10','PSA 9','PSA 8','BGS 10','BGS 9.5','BGS 9','CGC 10','CGC 9.5','CGC 9','SGC 10','Outra'];
const setIdOf = cid => (cid && cid.indexOf('-')>=0) ? cid.slice(0, cid.lastIndexOf('-')) : (cid||'');
const lotKey = (id, variant, grade) => id+'::'+(variant||'normal')+'::'+(grade||'raw');   // permite ter normal E reverse (e avaliações) da mesma carta
let owned = LS.get('pdc.owned', null);
if(owned===null){                         // migração única da coleção antiga (uma carta por Pokémon)
  owned={};
  for(const k in collection){ const o=collection[k]; if(o && o.cardId){
    const dm=k.match(/^d(\d+)/);
    owned[lotKey(o.cardId,'normal','raw')]={ id:o.cardId, name:o.name||'', setId:setIdOf(o.cardId), setName:o.setName||'', image:o.image||null,
      rarity:o.rarity||null, no:o.no||'', dexId: dm?[+dm[1]]:[], lang:'en', qty:1, grade:'raw', variant:'normal', value:null,
      mkt:(o.price&&o.price.value!=null)?{value:o.price.value,cur:o.price.cur||'EUR'}:null, addedAt:o.addedAt||Date.now() };
  }}
  LS.set('pdc.owned', owned);
}
const saveOwned = () => LS.set('pdc.owned', owned);
if(Object.keys(owned).some(k=>k.indexOf('::')<0)){   // migrar chaves antigas (por cardId) para lotes
  const n={}; for(const k in owned){ const o=owned[k]; n[lotKey(o.id,o.variant,o.grade)]=o; } owned=n; saveOwned();
}

let ownedByDex={};
function rebuildOwnedIndex(){ ownedByDex={}; for(const k in owned){ (owned[k].dexId||[]).forEach(n=>{ (ownedByDex[n]=ownedByDex[n]||[]).push(k); }); } }
rebuildOwnedIndex();
function ownedMatchesSlot(n, form){ const ks=ownedByDex[n]; if(!ks) return null; form=form||'base';
  for(const k of ks){ if(owned[k] && detectForm(owned[k].name)===form) return owned[k]; } return null; }
function cardLots(id){ return Object.values(owned).filter(o=>o.id===id); }
function ownedHasCard(id){ return Object.values(owned).some(o=>o.id===id); }
function defaultVariant(card){ const v=card&&card.variants; if(!v) return 'normal'; if(v.normal) return 'normal'; if(v.holo) return 'holo'; if(v.reverse) return 'reverse'; if(v.firstEdition) return 'firstEdition'; return 'normal'; }
function addOwnedCard(card, opts){
  opts=opts||{}; const id=card.id; if(!id) return null;
  const variant=opts.variant||defaultVariant(card), grade=opts.grade||'raw';
  const key=lotKey(id,variant,grade); const ex=owned[key];
  const any=ex||Object.values(owned).find(o=>o.id===id);   // metadados/preços partilham entre lotes da mesma carta
  const total=(card.set&&card.set.cardCount&&card.set.cardCount.official)?('/'+card.set.cardCount.official):'';
  owned[key]={ id, name:card.name||(ex&&ex.name)||(any&&any.name)||'', setId:setIdOf(id),
    setName:(card.set&&card.set.name)||card.setName||(ex&&ex.setName)||(any&&any.setName)||'',
    image:(card.image!==undefined?card.image:(ex&&ex.image))||(any&&any.image)||null,
    rarity:(card.rarity!==undefined?card.rarity:(ex&&ex.rarity))||(any&&any.rarity)||null,
    no:(card.localId!=null?(String(card.localId)+total):(card.no||(ex&&ex.no)||(any&&any.no)||'')),
    dexId:(card.dexId&&card.dexId.length?card.dexId:((ex&&ex.dexId)||(any&&any.dexId)))||[], lang:card.lang||(ex&&ex.lang)||'en',
    qty:(opts.qty!=null?opts.qty:(ex?ex.qty:1)), grade, variant,
    value:(opts.value!==undefined?opts.value:(ex?ex.value:null)),
    mkt:(ex?ex.mkt:(any?any.mkt:null)), mktTs:(ex?ex.mktTs:(any?any.mktTs:0)), addedAt:(ex?ex.addedAt:Date.now()) };
  saveOwned(); rebuildOwnedIndex(); return owned[key];
}
function removeLot(key){ if(owned[key]){ delete owned[key]; saveOwned(); rebuildOwnedIndex(); } }
function removeOwnedCard(id){ let ch=false; for(const k of Object.keys(owned)){ if(owned[k].id===id){ delete owned[k]; ch=true; } } if(ch){ saveOwned(); rebuildOwnedIndex(); } }
const VARIANT_LABEL={normal:'Normal', holo:'Holo', reverse:'Reverse Holo', firstEdition:'1ª Edição'};
function extractPrices(pr){   // → {base, foil}  (base = normal/holo; foil = reverse holo)
  const cm=pr&&pr.cardmarket, tp=pr&&pr.tcgplayer; let base=null, foil=null;
  if(cm){ if((cm.trend??cm.avg??cm.low)!=null) base={value:cm.trend??cm.avg??cm.low,cur:'EUR',avg7:cm.avg7,avg30:cm.avg30};
    if((cm['trend-holo']??cm['avg-holo']??cm['low-holo'])!=null) foil={value:cm['trend-holo']??cm['avg-holo']??cm['low-holo'],cur:'EUR',avg7:cm['avg7-holo'],avg30:cm['avg30-holo']}; }
  if(tp){ if(!base){ let mp=null; for(const k of ['holofoil','normal','1st-edition-holofoil']){ if(tp[k]&&tp[k].marketPrice!=null){mp=tp[k].marketPrice;break;} } if(mp==null) for(const k in tp){ if(tp[k]&&typeof tp[k]==='object'&&tp[k].marketPrice!=null){mp=tp[k].marketPrice;break;} } if(mp!=null) base={value:mp,cur:'USD'}; }
    if(!foil && tp['reverse-holofoil']&&tp['reverse-holofoil'].marketPrice!=null) foil={value:tp['reverse-holofoil'].marketPrice,cur:'USD'}; }
  return {base, foil};
}
function priceForVariant(mkt, variant){
  if(!mkt) return null;
  if(mkt.base!==undefined||mkt.foil!==undefined){ if(variant==='reverse') return mkt.foil||mkt.base||null; return mkt.base||mkt.foil||null; }
  if(mkt.value!=null) return {value:mkt.value,cur:mkt.cur||'EUR',avg7:mkt.avg7,avg30:mkt.avg30};   // formato antigo
  return null;
}
function cardMkt(c){ return priceForVariant(c.mkt, c.variant||'normal'); }
function cardUnitValue(c){ if(!c) return null; if(c.value!=null) return {value:c.value,cur:'EUR',manual:true}; const p=cardMkt(c); return p&&p.value!=null?{value:p.value,cur:p.cur||'EUR',manual:false}:null; }
function cardTotalValue(c){ const u=cardUnitValue(c); return u? u.value*(c.qty||1) : 0; }
function walletTotal(){ let t=0; for(const id in owned) t+=cardTotalValue(owned[id]); return t; }
async function refreshOwnedPrices(onProgress){
  const byCard={};
  for(const k in owned){ const c=owned[k]; if(c.value!=null) continue; const has=c.mkt&&(c.mkt.base||c.mkt.foil||c.mkt.value!=null); if(!has || (Date.now()-(c.mktTs||0))>3*DAY) (byCard[c.id]=byCard[c.id]||[]).push(k); }
  const ids=Object.keys(byCard); let done=0,total=ids.length; if(onProgress) onProgress(0,total);
  await pool(ids, async id=>{ const d=await fetchDetail(owned[byCard[id][0]]);
    const prices=(d&&d.prices&&(d.prices.base||d.prices.foil))?d.prices:null;
    for(const k of byCard[id]){ if(prices) owned[k].mkt=prices; else owned[k].mkt=owned[k].mkt||{base:null,foil:null}; owned[k].mktTs=Date.now(); }
    done++; if(onProgress) onProgress(done,total);
  }, 8);
  saveOwned(); return total;
}

// IndexedDB cache for API responses
let _db=null;
function idb(){ return _db || (_db = new Promise((res,rej)=>{ let r=indexedDB.open('pdc-cache',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); }
async function idbGet(k){ try{ const db=await idb(); return await new Promise((res)=>{ let t=db.transaction('kv').objectStore('kv').get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>res(null); }); }catch(e){ return null; } }
async function idbSet(k,v){ try{ const db=await idb(); const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); }catch(e){} }
const DAY = 864e5;

/* ============================ api ============================ */
// English (GraphQL) is the Western superset; Japanese/Chinese/Korean are DISTINCT cards (REST per language).
const LANGS_EXTRA = ['ja','zh-tw','ko'];
const LANG_CHIP = {en:'EN', ja:'JP', 'zh-tw':'ZH', ko:'KR', pt:'PT', fr:'FR', de:'DE', es:'ES', it:'IT'};
const REST_LANG = lang => `https://api.tcgdex.net/v2/${lang||'en'}/cards/`;
function langChip(c){ return (c.lang && c.lang!=='en') ? ` <span class="lchip l-${c.lang.replace('-','')}">${LANG_CHIP[c.lang]||c.lang.toUpperCase()}</span>` : ''; }

async function fetchDexCards(n){
  const key = 'cards4:'+n;
  const c = await idbGet(key);
  if (c && (Date.now()-c.ts) < 14*DAY) return c.cards;
  const query = `{ cards(filters:{dexId:${n}}) { id localId name rarity image suffix variants{holo reverse normal firstEdition} set{id name cardCount{official total}} } }`;
  const results = await Promise.all([
    fetch(GQL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({query})}).then(r=>r.json()),
    ...LANGS_EXTRA.map(L => fetch(`https://api.tcgdex.net/v2/${L}/cards?dexId=eq:${n}`).then(r=> r.ok?r.json():[]).catch(()=>[]))
  ]);
  const en = results[0];
  if(en.errors || !en.data) throw new Error('api');
  const cards = (en.data.cards || []).map(c => ({...c, lang:'en'}));
  const seen = new Set(cards.map(c=>c.id));           // dedupe: zh-tw/ko reuse Japanese set ids
  LANGS_EXTRA.forEach((L,i)=>{
    (results[i+1]||[]).forEach(b=>{
      if(!b || !b.id || seen.has(b.id)) return;
      seen.add(b.id);
      cards.push({ id:b.id, localId:b.localId, name:b.name, image:b.image||null, lang:L,
        rarity:null, suffix:null, variants:{}, set:{ id:(b.id||'').split('-')[0], name:'', cardCount:{} } });
    });
  });
  idbSet(key, {cards, ts:Date.now()});
  return cards;
}
// one detail fetch → price (+ rarity/set for non-English cards whose brief list was thin)
async function fetchDetail(card){
  const id = typeof card==='string' ? card : card.id;
  const lang = (typeof card==='object' && card.lang) || 'en';
  const key = 'det:'+id;
  const c = await idbGet(key);
  if (c && (Date.now()-c.ts) < 3*DAY) return c.val;
  let val = {price:null};
  try{
    const r = await fetch(REST_LANG(lang)+id);
    if(r.ok){
      const j = await r.json();
      const pr = extractPrices(j.pricing);
      val = {price: pr.base||pr.foil||null, prices:pr, rarity:j.rarity||null, setName:(j.set&&j.set.name)||'', setTotal:(j.set&&j.set.cardCount&&j.set.cardCount.official)||null};
    }
  }catch(e){}
  idbSet(key, {val, ts:Date.now()});
  return val;
}
function enrichCard(c, d){
  if(!d || c.lang==='en') return false;
  let changed=false;
  if(d.rarity && c.rarity!==d.rarity){ c.rarity=d.rarity; changed=true; }
  if(d.setName && c.set.name!==d.setName){ c.set.name=d.setName; changed=true; }
  if(d.setTotal && (!c.set.cardCount||c.set.cardCount.official!==d.setTotal)){ c.set.cardCount={official:d.setTotal, total:d.setTotal}; changed=true; }
  return changed;
}
function refreshCardTile(c){
  const el=document.querySelector(`.ccard[data-id="${CSS.escape(c.id)}"]`); if(!el) return;
  const rar=el.querySelector('.rar'); if(rar) rar.textContent=c.rarity||'—';
  const cset=el.querySelector('.cset'); if(cset){ const no=cardNo(c); cset.innerHTML=`${c.set.name||''}${no?` · <span class="tnum">${no}</span>`:''}${langChip(c)}`; }
  if(isArtRarity(c.rarity)){ const tb=el.querySelector('.topbadges'); if(tb && !tb.querySelector('.ribbon.art')) tb.insertAdjacentHTML('afterbegin','<span class="ribbon art">★ Art</span>'); }
}
// Best-effort image fallback for cards TCGdex has no artwork for (via pokemontcg.io).
// Cardmarket has no image API and blocks hotlinking, so it can't be used here.
async function fetchFallbackImage(card){
  const key = 'img2:'+card.id;
  const c = await idbGet(key);
  if(c) return c.url;             // cached (url may be null = "tried, none")
  let url = null;
  try{
    const name = card.name.replace(/[":\\]/g,' ').replace(/\s+/g,' ').trim();
    const num = card.localId ? String(card.localId).replace(/^0+/,'') : '';
    const q = `name:"${name}"` + (num?` number:${num}`:'');
    const r = await fetch(`https://api.pokemontcg.io/v2/cards?q=${encodeURIComponent(q)}&pageSize=1&select=images`);
    if(r.ok){ const j = await r.json(); const d = j.data && j.data[0]; if(d && d.images) url = d.images.small || d.images.large; }
  }catch(e){}
  idbSet(key, {url, ts:Date.now()});
  return url;
}
async function pool(items, worker, size=8){
  const it = items[Symbol.iterator](); let x;
  const run = async()=>{ while(!(x=it.next()).done){ await worker(x.value); } };
  await Promise.all(Array(Math.min(size, items.length||1)).fill(0).map(run));
}
const fmtPrice = p => !p||p.value==null ? '—' : (p.cur==='USD'?'$':'€') + p.value.toFixed(2);

/* ============================ form detection ============================ */
function detectForm(name){
  if(/^Alolan\b/i.test(name)) return 'alola';
  if(/^Galarian\b/i.test(name)) return 'galar';
  if(/^Hisuian\b/i.test(name)) return 'hisui';
  if(/^Paldean\b/i.test(name)) return 'paldea';
  if(/^Mega\b/i.test(name) || /^M\s+\S/.test(name)) return 'mega';
  return 'base';
}

/* ============================ progress ============================ */
function progress(){
  let base=0, reg=0, other=0;
  for(const k in collection){
    if(/^d\d+$/.test(k)) base++;
    else{ const f=k.split(':')[1]; if(REGION_LABEL[f]) reg++; else other++; }
  }
  return {base, reg, other};
}
function pokedexValue(){   // valor das cartas representativas da Pokédex (1 por slot)
  let t=0,n=0;
  for(const k in collection){ const rep=collection[k]; if(rep&&rep.cardId){ n++;
    let v=0; cardLots(rep.cardId).forEach(l=>{ const u=cardUnitValue(l); if(u&&u.value>v) v=u.value; });
    if(!v && rep.price&&rep.price.value!=null) v=rep.price.value; t+=v; } }
  return {value:t, count:n};
}
function renderProgress(){
  const p = progress();
  const pct = Math.round(p.base/NATIONAL.length*100);
  document.getElementById('pbarFill').style.width = pct+'%';
  const pv = pokedexValue();
  document.getElementById('pcount').innerHTML = `<b>${p.base}</b>/${NATIONAL.length}${pv.value>0?(' · '+fmtEur(pv.value)):''}`;
}

/* ============================ grid ============================ */
let searchTerm='';
function slotVisible(mon, region){
  const owned = !!collection[slotId(mon.n, region)];
  const f=settings.filter;
  if(f==='regional' && !region) return false;      // "Regionais" mostra só formas regionais
  if(f==='owned' && !owned) return false;
  if(f==='missing' && owned) return false;
  if(settings.gen!=='all'){ const [a,b]=GEN_RANGES[settings.gen]; if(mon.n<a||mon.n>b) return false; }
  if(searchTerm){ const t=searchTerm.toLowerCase();
    const label=((region?REGION_LABEL[region]+' ':'')+mon.name).toLowerCase();
    if(!label.includes(t) && String(mon.n)!==t && String(mon.n).padStart(3,'0')!==t) return false; }
  return true;
}
// build the ordered grid: each base species, then its regional forms right after
function gridSlots(){
  const out=[];
  for(const mon of NATIONAL){
    if(slotVisible(mon,null)) out.push({mon});
    const regs=REGIONAL[mon.n];
    if(regs) for(const [region,artId] of regs){ if(slotVisible(mon,region)) out.push({mon,region,artId}); }
  }
  return out;
}
function tileHTML(slot){
  const {mon,region,artId}=slot;
  const own=collection[slotId(mon.n,region)];
  const owned=!!own;
  const name=region?`${REGION_LABEL[region]} ${mon.name}`:mon.name;
  const useCard=settings.listImage==='card' && own && own.image;
  const img=useCard?cardImg(own.image,'low'):ARTWORK(region?artId:mon.n);
  const df=region?` data-form="${region}"`:'';
  let sub='';
  if(owned){
    if(own.cardId) sub=`<div class="ownedcard">🃏 ${own.setName||''} ${own.price?('· <b>'+fmtPrice(own.price)+'</b>'):''}</div>`;
    else sub=`<div class="nocardtag">✔ tenho · sem carta</div>`;
  } else sub=`<div class="nocardtag"></div>`;
  return `<article class="tile ${owned?'owned':''} ${useCard?'card-mode':''} ${region?'reg-tile':''}" data-n="${mon.n}"${df}>
    <div class="rbadges">${region?`<span class="rbadge reg">${REGION_LABEL[region]}</span>`:(REGIONAL[mon.n]?`<span class="rbadge soft">+ regional</span>`:'')}</div>
    <button class="check" data-check="${mon.n}"${df} aria-label="${owned?'Tenho':'Marcar'}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </button>
    <div class="imgbox"><img loading="lazy" decoding="async" src="${img}" alt="${name}" onerror="this.onerror=null;this.src='${PLACEHOLDER}'"></div>
    <div class="num tnum">#${String(mon.n).padStart(4,'0')}${region?' · '+REGION_LABEL[region].slice(0,3):''}</div>
    <div class="nm">${name}</div>
    ${sub}
  </article>`;
}
function renderGrid(){
  const slots = gridSlots();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('gridEmpty');
  if(!slots.length){ grid.innerHTML=''; empty.hidden=false; empty.innerHTML='<b>Nada por aqui</b><br>Experimenta outro filtro ou pesquisa.'; return; }
  empty.hidden=true;
  grid.innerHTML = slots.map(tileHTML).join('');
  renderProgress();
}

async function renderDetail(n, form){
  curDex=n; curForm=form||'base'; curCards=null; priceMap={}; cardQuery='';   // own the state so direct URL / reload works
  showView('detail');
  const mon = NATIONAL.find(m=>m.n===n);

  window.scrollTo(0,0);
  el.innerHTML = `<div class="dtop"><button class="back" id="backBtn" aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>

  document.getElementById('backBtn').onclick = closeDetail;

  try{ cards = await fetchDexCards(n); }
  catch(e){
    if(curDex!==n) return;
    el.querySelector('.loader').outerHTML = `<div class="errbox">Não consegui carregar as cartas (sem ligação?).<br><br><button class="btn pri" onclick="renderDetail(${n})">Tentar de novo</button></div>`;
    return;
  }
  if(curDex!==n) return;

  const byForm = {};
  for(const c of cards){ const f=detectForm(c.name); (byForm[f]=byForm[f]||[]).push(c); }
  curCards = byForm;
  const formsPresent = FORM_ORDER.filter(f=>byForm[f] && byForm[f].length);

function sortCards(cards){
  if(sortMode==='rarity') return cards.sort((a,b)=> rarityRank(a.rarity)-rarityRank(b.rarity));
  if(sortMode==='recent') return cards.sort((a,b)=> (a.set.id<b.set.id?1:-1));
  // value
  return cards.sort((a,b)=>{
    const pa=priceMap[a.id], pb=priceMap[b.id];
    const va=pa&&pa.value!=null?pa.value:-1, vb=pb&&pb.value!=null?pb.value:-1;
    if(vb!==va) return vb-va;
    return rarityRank(a.rarity)-rarityRank(b.rarity);
  });
}
function bestValue(cards){
  let best=null;
  for(const c of cards){ const p=priceMap[c.id]; if(p&&p.value!=null&&(!best||p.value>best.value)) best={id:c.id,value:p.value,cur:p.cur,name:c.name,set:c.set.name}; }
  return best;
}

function allCardsOf(){ let a=[]; for(const f in curCards) a=a.concat(curCards[f]); return a; }
function ownedIdSet(){ const s=new Set(); for(const k in collection){ const o=collection[k]; if(o&&o.cardId) s.add(o.cardId); } return s; }
function cardMatches(c, qraw){
  const q=(qraw||'').toLowerCase().replace(/\s+/g,'');
  if(!q) return true;
  const code=SETCODES[c.set.id]||'';                       // ex. "MEW" (set 151)
  const num=(c.localId!=null?String(c.localId):'');         // "019"
  const numNoZero=num.replace(/^0+/,'')||num;               // "19"
  const tot=(c.set.cardCount&&c.set.cardCount.official)?String(c.set.cardCount.official):'';
  const hay=[c.name,c.set.name,code,c.id,num,numNoZero,num+'/'+tot,numNoZero+'/'+tot,(c.rarity||'')]
    .join(' ').toLowerCase().replace(/\s+/g,'');
  return hay.includes(q);
}
function visibleCards(){
  if(cardQuery) return allCardsOf().filter(c=>cardMatches(c, cardQuery));
  return (curCards[curForm]||[]).slice();
}
function renderCards(mon, sid){
  const grid = document.getElementById('cgrid'); if(!grid) return;
  const cards = visibleCards();
  const oids = ownedIdSet();
  const sorted = sortCards(cards.slice());
  const top = sortMode==='value' ? bestValue(sorted) : null;
  grid.innerHTML = sorted.length ? sorted.map(c=>cardHTML(c, oids, top&&top.id)).join('')
    : `<div class="errbox" style="grid-column:1/-1">Nenhuma carta encontrada.</div>`;
  const byId = {}; allCardsOf().forEach(c=>byId[c.id]=c);
  grid.querySelectorAll('[data-pick]').forEach(b=> b.onclick=()=>choose(mon, byId[b.dataset.pick]));
  const sub = document.getElementById('cardCountSub');
  if(sub) sub.textContent = cardQuery ? `${cards.length} resultado${cards.length!==1?'s':''}` : `${cards.length} carta${cards.length!==1?'s':''}`;
  ensurePrices(mon, sid, cards);
  loadFallbackImages(cards);
}
async function loadFallbackImages(cards){
  const need = cards.filter(c=>!c.image);
  if(!need.length) return;
  const my = ++imgToken;
  await pool(need, async c=>{
    if(my!==imgToken) return;
    const url = await fetchFallbackImage(c);
    if(!url || my!==imgToken) return;
    const ci = document.querySelector(`.ccard[data-id="${CSS.escape(c.id)}"] .ci`);
    if(ci){ const ph=ci.querySelector('.ph'); if(ph) ph.remove();
      const img=document.createElement('img'); img.loading='lazy'; img.decoding='async'; img.src=url; img.alt=c.name;
      ci.insertBefore(img, ci.firstChild); }
  }, 3);
}
async function ensurePrices(mon, sid, cards){
  const note = document.getElementById('priceNote');
  const need = cards.filter(c=>priceMap[c.id]===undefined);
  if(need.length){
    const token = ++priceToken;
    let done=0, total=need.length;
    if(note) note.textContent = `preços 0/${total}…`;
    await pool(need, async c=>{
      if(token!==priceToken) return;
      const d = await fetchDetail(c);
      const p = (d&&d.price)||{value:null};
      priceMap[c.id] = p;
      if(enrichCard(c,d)) refreshCardTile(c);
      done++;
      if(token!==priceToken) return;
      const cell = document.querySelector(`.ccard[data-id="${CSS.escape(c.id)}"] .cprice`);
      if(cell) cell.outerHTML = `<span class="cprice ${p&&p.cur==='USD'?'usd':''}">${fmtPrice(p)}</span>`;
      if(note) note.textContent = done<total ? `preços ${done}/${total}…` : '';
    }, 8);
    if(token!==priceToken) return;
  }
  if(note) note.textContent='';
  if(sortMode==='value') reorderByValue(sid, cards);   // reorder DOM in place, no re-fetch
  showUpgradeHint(sid, cards);
}
function reorderByValue(sid, cards){
  const grid = document.getElementById('cgrid'); if(!grid) return;
  const sorted = sortCards(cards.slice());
  const frag = document.createDocumentFragment();
  sorted.forEach(c=>{ const n = grid.querySelector('.ccard[data-id="'+CSS.escape(c.id)+'"]'); if(n) frag.appendChild(n); });
  grid.appendChild(frag);
  grid.querySelectorAll('.ribbon.top').forEach(x=>x.remove());
  const best = bestValue(sorted);
  if(best){ const n = grid.querySelector('.ccard[data-id="'+CSS.escape(best.id)+'"]'); if(n){ const tb = n.querySelector('.topbadges'); if(tb) tb.insertAdjacentHTML('beforeend','<span class="ribbon top">💎 TOP €</span>'); } }
}
function showUpgradeHint(sid, cards){
  const own = collection[sid];
  if(document.getElementById('upHint')) return;
  if(own && own.cardId && own.price && own.price.value!=null){
    const best = bestValue(cards);
    if(best && best.id!==own.cardId && best.value > own.price.value*1.15){
      const acts = document.querySelector('#formBody .mine .meta .acts');
      if(acts){
        const d=document.createElement('div'); d.id='upHint'; d.className='upgrade-hint'; d.style.padding='8px 0 0';
        d.innerHTML = `⬆ Podias valorizar: <b>${best.name}</b> (${best.set}) vale ${(best.cur==='USD'?'$':'€')+best.value.toFixed(2)}.`;
        acts.after(d);
      }
    }
  }
}
function choose(mon, card){

    removeOwnedCard(card.id); delete collection[sid]; saveCollection(); repaint(); toast('Removida'); return;
  }

let _codeToSet=null;
function codeToSet(){ if(_codeToSet) return _codeToSet; _codeToSet={}; for(const sid in SETCODES){ const c=(SETCODES[sid]||'').toUpperCase(); if(!c) continue; (_codeToSet[c]=_codeToSet[c]||[]).push(sid); } return _codeToSet; }  // um código pode ter vários sets (ex. 30C)
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'; s.onload=res; s.onerror=()=>rej(new Error('cdn')); document.head.appendChild(s); });
}
function parseScan(text){
  const up=(text||'').toUpperCase();
  const numM=up.match(/(\d{1,3})\s*\/\s*(\d{1,3})/);
  const codes=codeToSet();
  const tokens=up.split(/[^A-Z0-9]+/).filter(Boolean);
  let code=null;
  for(const t of tokens){ if(t.length>=2 && t.length<=5 && !/^\d+$/.test(t) && codes[t]){ code=t; break; } }
  return {num: numM?numM[1]:null, totalStr: numM?numM[2]:null, code, raw:(text||'').trim()};
}
async function findCardId(setId, num){
  try{ const r=await fetch(`https://api.tcgdex.net/v2/en/sets/${setId}`); if(!r.ok) return null;
    const set=await r.json(); const cards=set.cards||[]; const t=String(parseInt(num,10));
    const f=cards.find(c=>String(parseInt(c.localId,10))===t) || cards.find(c=>c.localId===num);
    return f?f.id:null;
  }catch(e){ return null; }
}

let _setsList=null;
async function fetchSetsList(){
  if(_setsList) return _setsList;
  const cached=await idbGet('setslist2');
  if(cached && cached.list && (Date.now()-cached.ts)<30*DAY){ _setsList=cached.list; return _setsList; }
  try{ const r=await fetch('https://api.tcgdex.net/v2/en/sets'); const arr=await r.json();
    _setsList=arr.map(s=>({id:s.id, name:s.name, code:SETCODES[s.id]||'', cnt:(s.cardCount&&s.cardCount.official)||0})).reverse();  // recentes primeiro
    idbSet('setslist2',{list:_setsList, ts:Date.now()});
  }catch(e){ _setsList=[]; }
  return _setsList;
}

      if(card) showScanCard(ov, card, retry, close);
      else { toast('Não encontrei o nº '+n+' nesse set — confirma o número'); draw(q); }

async function openScan(){
  let stream=null;
  const ov=document.createElement('div'); ov.className='scan-overlay';
  ov.innerHTML=`
    <div class="scan-top"><button class="scan-close" aria-label="Fechar">✕</button><span>Digitalizar carta</span></div>
    <div class="scan-stage"><video autoplay playsinline muted></video><div class="scan-band"></div></div>
    <div class="scan-hint">Aproxima a carta e <b>alinha só o número</b> (ex. 030/198 · OBF) dentro da faixa dourada. Boa luz ajuda muito.</div>
    <div class="scan-actions"><button class="scan-capture">Ler número</button></div>`;
  document.body.appendChild(ov);
  const video=ov.querySelector('video');
  const stopCam=()=>{ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } };
  const close=()=>{ stopCam(); ov.remove(); };
  ov.querySelector('.scan-close').onclick=close;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
    video.srcObject=stream; await video.play().catch(()=>{});
  }catch(e){
    ov.querySelector('.scan-stage').innerHTML=`<div class="scan-msg">Não consegui aceder à câmara.<br><br>Confirma a permissão da câmara para a app.</div>`;
    ov.querySelector('.scan-actions').innerHTML=`<button class="scan-capture" id="scanCloseBtn">Fechar</button>`;
    ov.querySelector('#scanCloseBtn').onclick=close; return;
  }
  const capBtn=ov.querySelector('.scan-capture');
  capBtn.onclick=async()=>{
    const vw=video.videoWidth, vh=video.videoHeight; if(!vw) return;
    capBtn.disabled=true;
    // crop just the gold band from the video (object-fit:cover mapping) and upscale 4x
    const stage=ov.querySelector('.scan-stage'), band=ov.querySelector('.scan-band');
    const sr=stage.getBoundingClientRect(), br=band.getBoundingClientRect();
    const scale=Math.max(sr.width/vw, sr.height/vh);
    const offX=(vw*scale - sr.width)/2, offY=(vh*scale - sr.height)/2;
    let vx=(br.left - sr.left + offX)/scale, vy=(br.top - sr.top + offY)/scale;
    let vwid=br.width/scale, vhei=br.height/scale;
    vx=Math.max(0,vx); vy=Math.max(0,vy); vwid=Math.min(vwid, vw-vx); vhei=Math.min(vhei, vh-vy);
    const up=4;
    const oc=document.createElement('canvas'); oc.width=Math.round(vwid*up); oc.height=Math.round(vhei*up);
    const octx=oc.getContext('2d');
    octx.drawImage(video, vx, vy, vwid, vhei, 0, 0, oc.width, oc.height);
    try{ const im=octx.getImageData(0,0,oc.width,oc.height); const d=im.data;
      for(let i=0;i<d.length;i+=4){ let g=0.3*d[i]+0.59*d[i+1]+0.11*d[i+2]; g=(g-128)*1.5+128; d[i]=d[i+1]=d[i+2]=(g<0?0:g>255?255:g); }
      octx.putImageData(im,0,0);
    }catch(e){}
    const strip=oc.toDataURL('image/jpeg',0.7);
    stopCam();
    const stg=ov.querySelector('.scan-stage'); stg.style.flex='0 0 auto';
    stg.innerHTML=`<div class="scan-msg"><div class="spin" style="margin:0 auto 14px"></div>A ler o número…<br><small>(a 1ª vez descarrega o motor de OCR — aguarda)</small></div>`;
    ov.querySelector('.scan-actions').innerHTML='';
    let engineOk=true; try{ await loadTesseract(); }catch(e){ engineOk=false; }
    if(!engineOk){
      stg.innerHTML=`<div class="scan-msg">Não consegui carregar o motor de OCR.<br><br>Verifica a internet e tenta outra vez.</div>`;
      ov.querySelector('.scan-actions').innerHTML=`<button class="scan-capture" id="scanRetry2">Tentar de novo</button>`;
      ov.querySelector('#scanRetry2').onclick=()=>{ ov.remove(); openScan(); }; return;
    }
    let text=''; try{ const {data}=await Tesseract.recognize(oc,'eng'); text=data.text||''; }catch(e){ text=''; }
    handleScanResult(ov, parseScan(text), close, strip);
  };
}
async function handleScanResult(ov, parsed, close, strip){
  const stage=ov.querySelector('.scan-stage');
  const retry=()=>{ ov.remove(); openScan(); };
  if(parsed.code && parsed.num){
    stage.innerHTML=`<div class="scan-msg"><div class="spin" style="margin:0 auto 14px"></div>Encontrei <b>${parsed.code} ${parsed.num}</b> — a procurar…</div>`;
    const setIds=codeToSet()[parsed.code]||[];
    let card=null;
    for(const setId of setIds){ const id=await findCardId(setId, parsed.num); if(id){ card=await fetchCardFull(id); if(card) break; } }
    if(card){ return showScanCard(ov, card, retry, close); }
  }
  return showSetChooser(ov, parsed.num, retry, close, strip);   // sempre: número editável + escolher set (à prova de falhas)
}
function showScanCard(ov, card, retry, close){

  const total=(card.set&&card.set.cardCount&&card.set.cardCount.official)?('/'+card.set.cardCount.official):'';

      <div class="m"><b>${card.name}</b><span>${(card.set&&card.set.name)||''} · ${card.localId||''}${total}${card.rarity?' · '+card.rarity:''}</span>
        <span>${mon?('Pokémon: #'+String(n).padStart(4,'0')+' '+mon.name):'(sem Pokémon associado)'}</span>
        ${price!=null?('<div class="pr">€'+price.toFixed(2)+'</div>'):''}</div></div>
    <div class="scan-res-actions"><button class="btn" id="scanNo">Não / outra</button><button class="btn gold" id="scanYes" ${mon?'':'disabled'}>Sim, adicionar</button></div>`;
  ov.appendChild(res);

    saveCollection(); renderGrid(); close(); toast('Adicionado ✔ '+card.name);
  };
}

    <div class="seclabel">Cartas mais valiosas</div>
    <div class="wtoplist">${top.map(c=>{ const u=cardUnitValue(c); return `<div class="wtop"><div class="wt-img"><img loading="lazy" src="${c.image?cardImg(c.image,'low'):PLACEHOLDER}" onerror="this.src='${PLACEHOLDER}'"></div>
      <div class="wt-m"><b>${c.name}</b><span>${c.setName||''} ${c.no?('· '+c.no):''}${c.variant&&c.variant!=='normal'?(' · '+VARIANT_LABEL[c.variant]):''}${c.grade&&c.grade!=='raw'?(' · '+c.grade):''}</span></div>
      <div class="wt-v tnum">${fmtEur(cardTotalValue(c))}${(c.qty||1)>1?('<small>'+c.qty+'×</small>'):(u&&u.manual?'<small>manual</small>':'')}</div></div>`; }).join('')}</div>
    <p class="wnote">Preços raw do Cardmarket (via TCGdex). Avaliadas usam o valor que meteste. Movimento = média 7/30 dias vs. agora.</p>`;
}

/* ============================ router ============================ */
function route(){
  const h=location.hash.replace('#','');
  let m;
  if(m=h.match(/^p(\d+)(?:-([a-z]+))?$/)){ renderDetail(+m[1], m[2]||null); }
  else if(m=h.match(/^set-(.+)$/)){ renderSetDetail(decodeURIComponent(m[1])); }
  else if(h==='sets'){ curDex=null; showView('sets'); renderSets(); }
  else if(h==='wallet'){ curDex=null; showView('wallet'); renderWallet(); }
  else { showView('home'); curDex=null; renderGrid(); }   // refresh so ownership marked in detail shows on the list
}
window.addEventListener('hashchange', route);

/* ============================ boot ============================ */
async function boot(){
  applyTheme();
  matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change', ()=>{ if(settings.theme==='system') applyTheme(); });
  // restore filter chips ui
  document.querySelectorAll('#filterChips .chip').forEach(c=>c.classList.toggle('on', c.dataset.filter===settings.filter));
  document.querySelectorAll('#genChips .chip').forEach(c=>c.classList.toggle('on', c.dataset.gen===settings.gen));
  sortMode = settings.sort || 'value';
  try{
    const [nat, reg, sc] = await Promise.all([
      fetch('national.json').then(r=>r.json()),
      fetch('regional.json').then(r=>r.json()),
      fetch('sets.json').then(r=>r.json()).catch(()=>({}))
    ]);
    NATIONAL = nat; REGIONAL = reg; SETCODES = sc || {};
    REG_TOTAL = Object.values(reg).reduce((s,a)=>s+a.length,0);
  }catch(e){
    document.getElementById('grid').innerHTML = '<div class="errbox">Não consegui carregar a lista base. Recarrega a página.</div>'; return;
  }
  document.getElementById('scanFab').onclick=openScan;
  document.getElementById('botnav').addEventListener('click', e=>{ const b=e.target.closest('[data-tab]'); if(!b) return;
    const t=b.dataset.tab; const target = t==='dex'?'':(t==='sets'?'sets':'wallet');
    if(location.hash.replace('#','')===target) route(); else location.hash=target; });
  renderGrid();
  route();
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
}
boot();
</script>
